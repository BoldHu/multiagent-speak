[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dial-skill"
version = "0.1.0"
description = "DIAL-Skill: Decision-Informed Adversarial-Margin Gating with Online Dual-Boundary Skill Evolution for Proactive Enterprise Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.60.0",
  "typesafe-sdk>=0.1.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0",
  "datasets>=2.20.0",
  "huggingface-hub>=0.24.0",
  "duckdb>=1.1.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "matplotlib>=3.9.0",
  "tenacity>=8.3.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "tqdm>=4.66.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "nbformat>=5.10.0",
  "ruff>=0.5.0",
]

[project.scripts]
dial-skill = "dial_skill.eval.runners:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
