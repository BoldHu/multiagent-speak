triage:
  theta_skip: 0.15
  theta_need: 0.25
  k_slate: 6
  recency_beta: 0.85
  active_window_turns: 10

recon:
  enabled_on_pagemantle: true
  theta_recon: 0.45
  max_calls: 3
  soft_cap_sec: 30.0
  eligible_skills: ["find", "check", "analyze", "diagnose", "guard"]

gate:
  lambda_disruption: 1.0
  theta_floor: 0.30
  tau_dm: 0.05
  tau_thread: 0.25
  tau_channel: 0.50
  tau_disagreement: 0.55
  skeptic_channel_cap_threshold: 0.60
  skill_prior_override_floor: 0.10
  temperature: 0.0

executor:
  hard_time_cap_sec: 180.0
  soft_time_cap_sec: 90.0
  default_max_tool_calls: 7
  tool_output_max_chars: 3000
  temperature: 0.2

evolution:
  eta_fp: 0.04
  eta_fn: 0.06
  eta_scope: 0.25
  delta_clip: 0.35
  gamma_clip: 2.0
  tp_decay: 0.98
  anchor_buffer_max: 8
  escrow_anchors_m: 3
  escrow_min_delta_shift: 0.05
  max_rules_per_side: 5
  max_investigation_steps: 4
  enable_escrow_gate: true

ablation:
  disable_triage: false                # A1: raw full chat directly to Advocate/Skeptic
  triage_backend_override: null        # A2: "openai_fallback" vs "jev"
  asymmetric_evidence: false           # A3: Advocate and Skeptic get asymmetrically filtered slates
  gate_mode: "dual_margin"             # A4: "dual_margin" | "advocate_only" | "skeptic_only" | "single_combined"
  binary_only: false                   # A5: collapse tiers to SILENT / CHANNEL_INTERVENE
  disable_disagreement_deesc: false    # A6: disable U_t epistemic disagreement de-escalation
  disable_skill_routing: false         # A7: generic prompt instead of 8 Dual-Boundary Skills
